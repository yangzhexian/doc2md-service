name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: CPU regression (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DOCS2MD_RUN_OCR: "0"
      DOCS2MD_REAL_REGRESSION_REPORT: tmp/ci/real-documents.json

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and dependency cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-test.in
            requirements-test.txt

      - name: Verify dependency lock inputs and outputs
        run: python scripts/lock_dependencies.py --check

      - name: Install locked runtime and test dependencies
        timeout-minutes: 15
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Check Unix launcher syntax
        run: |
          for script in start.sh update.sh scripts/install-autostart.sh; do
            bash -n "$script"
          done

      - name: Run unit and real document regressions
        timeout-minutes: 12
        run: python -m unittest discover -s tests -v

      - name: Upload real document regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-documents-${{ matrix.os }}-python3.12
          path: tmp/ci/
          if-no-files-found: warn
          retention-days: 14
